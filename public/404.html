<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Maison de Gaby</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1E2A44">
  <link rel="icon" href="/assets/favicon-g.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css?v=4">
  <style>
    .lost { min-height: 100vh; display: grid; place-content: center; text-align: center; padding: 40px 16px; }
    .lost img { width: 64px; height: 64px; margin: 0 auto 30px; }
    .lost h1 { font-size: clamp(44px, 7vw, 76px); margin-bottom: 20px; }
    .lost p { color: var(--muted); max-width: 26em; margin: 0 auto 34px; }
  </style>
</head>
<body>
  <main class="lost">
    <img src="/assets/mark.svg" alt="" width="64" height="64">
    <p class="eyebrow">Page not found</p>
    <h1>This page has <em>gone missing.</em></h1>
    <p>Perhaps it was eaten. The desserts are all still here, though.</p>
    <div><a class="btn btn-primary" href="/#menu">See the menu</a></div>
  </main>
</body>
</html>
